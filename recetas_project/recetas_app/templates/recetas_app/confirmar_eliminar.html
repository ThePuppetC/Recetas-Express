{% extends 'base.html' %}

{% block title %}Confirmar eliminación{% endblock %}

{% block content %}
<div class="container-xl py-5">
    <div class="row">
        <div class="col-lg-6 mx-auto">
            <div class="card shadow-sm border-danger">
                <div class="card-body p-4 text-center">
                    <h3 class="text-danger mb-3">⚠️ Confirmar Eliminación</h3>
                    <p class="lead">¿Estás seguro de que deseas eliminar la receta?</p>
                    <p class="h5 mb-4">{{ receta.titulo }}</p>
                    <p class="text-muted">Esta acción no se puede deshacer.</p>
                    
                    <form method="POST" class="d-grid gap-2 d-md-flex justify-content-md-center">
                        {% csrf_token %}
                        <a href="{% url 'detalle_receta' receta.id %}" class="btn btn-secondary btn-lg">❌ Cancelar</a>
                        <button type="submit" class="btn btn-danger btn-lg">🗑️ Eliminar Receta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
